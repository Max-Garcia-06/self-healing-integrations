[project]
name = "self-healing-integrations"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pytest",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "fastapi>=0.140.0",
    "uvicorn>=0.51.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = ["tom-jerry-agents", ".venv"]
